aid: maia-analytics
name: Maia-analytics
description: >-
  MAIA Analytics is an AI-powered geospatial analysis platform that lets anyone
  turn complex location data into actionable insights through natural-language
  queries, with no GIS degree required. It unifies open and proprietary data to
  reveal the built environment and supports use cases such as solar-site
  prospecting, building and parcel analysis, redevelopment and risk screening
  (flood zones, aging infrastructure), and location intelligence. Every answer is
  source-linked and verifiable. Founded in 2023 and backed by Homebrew. This
  profile was enriched from MAIA's public site and its publicly-served backend
  OpenAPI (the application's own FastAPI backend; MAIA does not publish an
  external developer program).
url: https://raw.githubusercontent.com/api-evangelist/maia-analytics/refs/heads/main/apis.yml
