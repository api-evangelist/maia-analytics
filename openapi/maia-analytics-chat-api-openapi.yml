          type: boolean
          title: Partial Result
          description: True when the workflow persisted a finalized partial turn before emitting this terminal (cooperative monitor stop). A resumed reader can't render replayed tool events, so it reloads history instead of treating this frame as fully rendered. False for generic errors and reader-synthesized hard-cancel terminals, where nothing new was persisted.
