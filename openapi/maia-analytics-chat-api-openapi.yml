      properties:
        type:
          type: string
          const: caught_up
          title: Type
          default: caught_up
        display:
          type: string
          const: internal
          title: Display
          default: internal
      type: object
      title: StreamChatCaughtUp
      description: 'A resumed reader has drained the persisted backlog; frames after this

        are live output.


        Synthesized per-connection by the resume path at the replay/live boundary —

        never written to the durable stream, so it cannot itself be replayed. Before

        this frame, replayed text may belong to an already-invalidated model attempt

        (a ``retry`` frame later in the backlog voids it), so the client must hold

        it; after this frame, deltas are ordinary live output and paint like the

        send path. Non-terminal, no payload; clients that don''t recognize the type

        ignore it and keep holding until a terminal.'
