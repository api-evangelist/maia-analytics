          - type: 'null'
          title: Status Code
          description: HTTP status code if available
        retry_suggested:
          type: boolean
          title: Retry Suggested
          description: Whether the user should retry
          default: true
        partial_result:
          type: boolean
          title: Partial Result
          description: True when the workflow persisted a finalized partial turn before emitting this terminal (a terminal model failure that had already completed tool work). A refresh-resumed reader reloads persisted history instead of treating this frame as fully rendered.
          default: false
        continuable:
          type: boolean
          title: Continuable
          description: 'True only when the failed turn left a partial the agent can resume from (the same condition that sets chats.last_turn_continuable). Distinct from partial_result: a turn can persist a partial yet not be continuable (e.g. a cooperative/monitor stop). The FE gates the Continue affordance on this, never on partial_result.'
          default: false
        new_messages:
          items:
            oneOf:
            - $ref: '#/components/schemas/ModelRequest'
            - $ref: '#/components/schemas/ModelResponse'
            discriminator:
              propertyName: kind
              mapping:
                request: '#/components/schemas/ModelRequest'
                response: '#/components/schemas/ModelResponse'
          type: array
