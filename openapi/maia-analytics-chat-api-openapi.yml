      - titleSource
      title: ProjectRenamedEvent
      description: 'Fired when a project''s name changes server-side, over the per-user channel.


        The trigger today is auto-title generation: a fire-and-forget task that

        generates a name several seconds into the turn, and can retry on a *later*

        message. By then the project is already ``ready`` and the FE''s creating-project

        poller has stopped watching it, so without this event the new name only surfaces

        on the next projects refetch — a manual refresh in practice.


        Carries the coordinates the FE needs to patch the projects-list cache in place:

        ``projectId`` to locate the row, ``name`` for the display, and ``titleSource``

        so the cached row matches what a refetch would read. camelCase wire shape,

        matching ``ViewStateChangedEvent`` / ``LayerStateChangedEvent``.


        Advisory only — a dropped publish degrades to the FE''s reconnect-resync.'
