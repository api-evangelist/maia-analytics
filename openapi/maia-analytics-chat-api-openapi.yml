            type: object
          - type: 'null'
          title: Provider Details
        part_kind:
          type: string
          const: builtin-tool-return
          title: Part Kind
          default: builtin-tool-return
      type: object
      required:
      - content
      title: NativeToolSearchReturnPart
      description: 'Typed view of a [`NativeToolReturnPart`][pydantic_ai.messages.NativeToolReturnPart] for tool search.


        Used on the native server-side tool-search path (Anthropic BM25/regex, OpenAI

        Responses) where the provider executes the search and emits a native result.

        The local-fallback path uses

        [`ToolSearchReturnPart`][pydantic_ai.messages.ToolSearchReturnPart] instead.


        To detect a tool-search part regardless of execution path (native server-side

        vs. local fallback), check `part.tool_kind == ''tool-search''` — this works

        across both call/return and both server/local variants.


        Shadows `content` with a narrower

        [`ToolSearchReturnContent`][pydantic_ai.messages.ToolSearchReturnContent]

        `TypedDict`.'
    SemanticType:
      type: string
      enum:
      - identifier
      - name
      - address_part
      - address_full
      - currency
      - area
      - height
      - count
      - category
      - zoning
      - date
      - phone
      - website
      - percent
      - generic
      title: SemanticType
      description: 'What a column *means* — drives FE rendering and formatting.


        Independent from ``ColumnDataType`` (the storage type hint): a column can

        be ``data_type=number, semantic_type=currency`` (parcel ``landval``) or

        ``data_type=number, semantic_type=area`` (``area_acres``). The FE renderer

        keys off ``semantic_type``, not ``data_type``.


        Lives here (with the wire model) rather than on ``LayerKind`` because under

        the self-describing contract this rides on ``LayerColumn`` across the wire

        — ``LayerKind`` is the backend-only producer that hydrates it.'
