    ChatSummarizationCompletedEvent:
      properties:
        type:
          type: string
          const: chat_summarization_completed
          title: Type
          default: chat_summarization_completed
        projectId:
          type: string
          format: uuid
          title: Projectid
      type: object
      required:
      - projectId
      title: ChatSummarizationCompletedEvent
      description: 'Fired when a chat''s background ``summarize_workflow`` finishes persisting.


        Summarization runs as a fire-and-forget DBOS workflow after a turn crosses

        the context threshold; the turn''s ``complete`` SSE frame (carrying

        ``summarization_task_id``) is the *enqueue* moment, ~50s before the summary

        actually generates + persists. The original turn''s direct stream has closed

        by then, so this advisory event over the per-user fanout is how the client

        learns the summary is genuinely done and renders the "summarized" divider.


        Advisory only — the durable summary is the source of truth: on reload the FE

        reconstructs the divider from persisted history (``detectSummarization``), so

        a dropped publish degrades to "divider appears on next reload," never a stuck

        state.


        Carries only ``projectId`` (camelCase wire shape, matching

        ``ViewStateChangedEvent`` / ``LayerStateChangedEvent``): ``chats.project_id``

        is UNIQUE (one chat per project), so the project anchors the chat and the FE

        needs no ``chat_id`` to route.'
