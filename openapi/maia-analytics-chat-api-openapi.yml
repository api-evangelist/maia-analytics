      description: "Provenance + lifecycle for the project's name field.\n\nReplaces an em-dash string heuristic (`\" — \" not in project.name`)\nthat gated whether the sandbox auto-titler should rename a project\nfrom its skeleton name. Encoding the decision as a typed enum makes\nthe check a single comparison and prevents future titlers that\nhappen to produce em-dashes from silently disabling the branch.\n\n- PLACEHOLDER: title is initial scaffolding (sandbox skeleton's\n  \"Boulder County\", initial scaffold name); eligible to be\n  replaced by the next titler.\n- AUTO: title set by an LLM auto-titler (agent_service\n  first-message rename or project setup using the user's plan\n  name); final.\n- USER: title set by an explicit user rename via PUT\n  /projects/{id}; final."
