        Carries the envelope ``bbox`` (``[minLng, minLat, maxLng, maxLat]``) of a feature

        already in the project''s data; the FE ``fitBounds`` to it. ``projectId`` gates the

        move to the active project (the per-user stream is not project-scoped). camelCase

        wire shape, matching the sibling events.


        Fire-and-forget / advisory: a dropped publish just means the camera doesn''t move —

        the agent''s text reply still names where it went.'
