          title: Address Template
          description: Ordered column keys the FE concatenates to compose a feature's address line. Sourced from the layer's `LayerKind`; may reference keys that aren't typed canonical columns (city, state_abbr, …). Empty for permissive kinds.
      type: object
      required:
      - id
      - project_id
      - name
      - style_config
      - feature_count
      - total_size_bytes
      - base_attributes
      - created_at
      - updated_at
      title: LayerModel
      description: Model for a layer.
    NavigateCursorResponse:
      properties:
        prev_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Prev Id
        next_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Id
        position:
          type: integer
          title: Position
        total:
          type: integer
          title: Total
      type: object
      required:
      - prev_id
      - next_id
      - position
      - total
      title: NavigateCursorResponse
      description: 'Server-side cursor result for prev/next navigation.


        Replaces the legacy client-side id-array cache (capped at 100k);

        each navigation invocation runs a single CTE on the live filtered

        set, so we cap-free up to whatever the filtered set actually

        contains. ``position`` is 0-based; ``total`` is the filtered set

        size.'
    BooleanCondition:
      properties:
        filterType:
          type: string
          const: boolean
          title: Filtertype
          default: boolean
        type:
          type: string
          enum:
          - blank
          - notBlank
          - equals
          - notEqual
          - unavailable
          title: Type
        filter:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Filter
      type: object
      required:
      - type
      title: BooleanCondition
    LayerVizStatsResponse:
      properties:
        breaks:
          items:
            type: number
          type: array
          title: Breaks
        min:
          anyOf:
          - type: number
          - type: 'null'
          title: Min
        max:
          anyOf:
          - type: number
          - type: 'null'
          title: Max
        count:
          type: integer
          title: Count
        geometry_kind:
          anyOf:
          - type: string
            enum:
            - point
            - line
            - polygon
          - type: 'null'
          title: Geometry Kind
      type: object
      required:
      - breaks
      - min
      - max
      - count
      - geometry_kind
      title: LayerVizStatsResponse
      description: 'Whole-layer stats for one numeric column, for classed map styling.


        ``breaks`` are the deduped ascending interior quintile boundaries

        (p20/p40/p60/p80); together with ``min``/``max`` they delimit up to five

        classes. Empty ``breaks`` with ``count`` 0 means the column has no

        non-null values. ``geometry_kind`` tells the client which classed styling

        applies (graduated circles for points, choropleth otherwise) — every

        layer carries both point and fill style layers, so the client cannot

        infer geometry from the style alone.'
    LoadCapabilityReturn:
      properties:
        instructions:
          type: string
          title: Instructions
      type: object
      title: LoadCapabilityReturn
      description: Typed return value for the `load_capability` tool.
    TextCondition:
      properties:
        filterType:
          type: string
          const: text
          title: Filtertype
          default: text
        type:
          type: string
          enum:
          - contains
          - notContains
          - equals
          - notEqual
          - startsWith
          - endsWith
          - blank
          - notBlank
          - unavailable
          title: Type
        filter:
          anyOf:
          - type: string
          - type: 'null'
          title: Filter
      type: object
      required:
      - type
      title: TextCondition
    ToolReturnPart:
      properties:
        tool_name:
          type: string
          title: Tool Name
        content:
          $ref: '#/components/schemas/ToolReturnContent'
        tool_call_id:
          type: string
          title: Tool Call Id
        tool_kind:
          anyOf:
          - type: string
            enum:
            - tool-search
            - capability-load
          - type: 'null'
          title: Tool Kind
        metadata:
          title: Metadata
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        outcome:
          type: string
          enum:
          - success
          - failed
          - denied
          title: Outcome
          default: success
        part_kind:
          type: string
          const: tool-return
          title: Part Kind
          default: tool-return
      type: object
      required:
      - tool_name
      - content
      title: ToolReturnPart
      description: A tool return message, this encodes the result of running a tool.
    ColumnKind:
      type: string
      enum:
      - source
      - merged
      - enrichment
      - system
      - agent_derived
      title: ColumnKind
      description: "Provenance discriminator for a layer column.\n\n* `source` — column SELECTed directly from the canonical Overture table.\n* `merged` — column joined in from another canonical source table (e.g.\n  `parcel_owner` on a building layer joined parcel data).\n* `enrichment` — populated by an enrichment runner, not the agent's SQL.\n  (Reserved for the upcoming enrichment unification — not used yet.)\n* `system` — agent-facing hide-by-default escape for lineage columns\n  merged for enrichment plumbing the user shouldn't see by default\n  (e.g. parcel address fields plumbed onto a building layer for Owner\n  Contact Info). Stays in the registered schema and can be surfaced\n  later via `modify_columns`.\n* `agent_derived` — computed in the agent's SQL (`SUM(...) AS total`,\n  `CASE WHEN ... END AS bucket`). Still requires source_table+source_column\n  anchoring so view deltas survive a column rename."
    FilteredIdsResponse:
      properties:
        ids:
          items:
            type: string
          type: array
          title: Ids
        total:
          type: integer
          title: Total
      type: object
      required:
      - ids
      - total
      title: FilteredIdsResponse
      description: 'Feature ids matching the current filter set, plus the unfiltered total.


        ``total`` reflects the full match count even when ``limit`` truncates ``ids`` —

        callers use it for "showing X of Y" UI and bulk-action sizing decisions.'
    SetCondition:
      properties:
        filterType:
          type: string
          const: set
          title: Filtertype
          default: set
        values:
          items:
            anyOf:
            - type: string
            - type: 'null'
          type: array
          maxItems: 10000
          title: Values
        type:
          anyOf:
          - type: string
            const: unavailable
          - type: 'null'
          title: Type
      type: object
      title: SetCondition
    PaginatedFeaturesResponse:
      properties:
        rows:
          items:
            $ref: '#/components/schemas/PaginatedFeatureRow'
          type: array
          title: Rows
        last_row:
          type: integer
          title: Last Row
        column_meta:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/ColumnMeta'
            type: object
          - type: 'null'
          title: Column Meta
      type: object
      required:
      - rows
      - last_row
      title: PaginatedFeaturesResponse
      description: 'Response for the paginated sandbox query endpoint.


        ``last_row`` is the exact filtered match count, computed alongside the

        page via a single windowed ``COUNT(*) OVER()``. AG Grid uses it to size

        the scrollbar and drive the "X of Y" footer without a follow-up call.'
    ColumnDetail:
      properties:
        name:
          type: string
          title: Name
        pg_type:
          type: string
          title: Pg Type
        type:
          type: string
          title: Type
        source:
          type: string
          enum:
          - base
          - enrichment
          - agent
          title: Source
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        categorical_options:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Categorical Options
        stats:
          $ref: '#/components/schemas/ColumnStats'
        enrichment:
          anyOf:
          - $ref: '#/components/schemas/EnrichmentColumnConfig'
          - type: 'null'
        unit:
          anyOf:
          - type: string
          - type: 'null'
          title: Unit
      type: object
      required:
      - name
      - pg_type
      - type
      - source
      - stats
      title: ColumnDetail
      description: Rich per-column metadata for the columns endpoint.
    FilteredCountResponse:
      properties:
        total:
          type: integer
          title: Total
        fingerprint:
          type: string
          title: Fingerprint
      type: object
      required:
      - total
      - fingerprint
      title: FilteredCountResponse
      description: 'Total row count matching the current filter set, no ids materialized.


        Use over ``filtered-ids`` when only the count is needed — skips the sort

        pass and id fetch. Backs the bulk-enrich confirm gate.


        ``fingerprint`` is a deterministic hash of every field on

        ``SSRTableQueryParams`` (minus pagination) plus the enrichment

        predicates that ride alongside; snapshot consumers like

        ``/enrich_async`` echo this value back in a ``FilterSelectionRequest``

        so the server can detect client-side spec drift between count and

        action.'
    NumberCondition:
      properties:
        filterType:
          type: string
          const: number
          title: Filtertype
          default: number
        type:
          type: string
          enum:
          - equals
          - notEqual
          - greaterThan
          - greaterThanOrEqual
          - lessThan
          - lessThanOrEqual
          - inRange
          - blank
          - notBlank
          - unavailable
          title: Type
        filter:
          anyOf:
          - type: number
          - type: 'null'
          title: Filter
        filterTo:
          anyOf:
          - type: number
          - type: 'null'
          title: Filterto
        units:
          anyOf:
          - type: string
          - type: 'null'
          title: Units
      type: object
      required:
      - type
      title: NumberCondition
    SharedEnrichmentListResponse:
      properties:
        enrichments:
          items:
            $ref: '#/components/schemas/SharedEnrichmentModel'
          type: array
          title: Enrichments
      type: object
      required:
      - enrichments
      title: SharedEnrichmentListResponse
    LayerExtentResponse:
      properties:
