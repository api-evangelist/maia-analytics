      title: ToolCallPart
      description: A tool call from a model.
    ColumnsMetadataResponse:
      properties:
        tile_url_template:
          type: string
          title: Tile Url Template
        total_rows:
          type: integer
          title: Total Rows
        columns:
          additionalProperties:
