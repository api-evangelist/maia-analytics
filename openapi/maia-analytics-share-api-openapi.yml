      title: LayerExtentResponse
      description: Response model for layer extent.
    TextContent:
      properties:
        content:
          type: string
          title: Content
        metadata:
          title: Metadata
        kind:
          type: string
          const: text-content
          title: Kind
          default: text-content
      type: object
      required:
      - content
      title: TextContent
      description: 'String content that is tagged with additional metadata.


        This is useful for including metadata that can be accessed programmatically by the application, but is not sent to the LLM.'
    PaginatedFeatureRow:
      additionalProperties: true
      type: object
    ToolCallPart:
      properties:
        tool_name:
          type: string
          title: Tool Name
        args:
          anyOf:
          - type: string
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Args
        tool_call_id:
          type: string
          title: Tool Call Id
        tool_kind:
          anyOf:
          - type: string
            enum:
            - tool-search
            - capability-load
          - type: 'null'
          title: Tool Kind
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        provider_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider Name
        provider_details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Provider Details
        part_kind:
          type: string
          const: tool-call
          title: Part Kind
          default: tool-call
      type: object
      required:
