          type: object
          title: Columns
      type: object
      required:
      - tile_url_template
      - total_rows
      - columns
      title: ColumnsMetadataResponse
      description: 'Response for GET /table/{layer_id}/columns.


        ``tile_url_template`` is a literal template; the client substitutes

        ``{layer_id}`` before handing the URL to Mapbox.'
    TextPart:
      properties:
        content:
          type: string
          title: Content
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        provider_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider Name
        provider_details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Provider Details
        part_kind:
          type: string
          const: text
          title: Part Kind
          default: text
      type: object
      required:
