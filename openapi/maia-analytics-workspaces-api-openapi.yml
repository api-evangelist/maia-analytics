    RetellConfigUpdateRequest:
      properties:
        retell_agent_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Retell Agent Id
        retell_qualify_agent_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Retell Qualify Agent Id
        retell_from_number:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Retell From Number
        retell_api_key:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
          title: Retell Api Key
        retell_signing_secret:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
          title: Retell Signing Secret
        auto_dial_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Auto Dial Enabled
        monthly_dial_minute_cap:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Monthly Dial Minute Cap
      type: object
      title: RetellConfigUpdateRequest
      description: 'Partial update for per-workspace Retell config (internal admin only).


        Pass an explicit `null` to clear an override (the dispatch path then

        falls back to env defaults). Omit a field to leave it untouched.


        `auto_dial_enabled` is the single gate that turns auto-dial on for the

        workspace — there is no PostHog flag layered on top, so flipping this

        to true makes the feature visible to workspace users immediately.'
    WorkspaceCountyLoadStatus:
      type: string
      enum:
      - provisioning
      - pending
      - loading
      - succeeded
      - failed
      title: WorkspaceCountyLoadStatus
      description: 'Load status for a workspace-county pair.


        Lifecycle: ``provisioning`` (initial — set by workspace standup before the

        Neon project is ready) → ``pending`` (set by ``provision_workspace_op``

        after schema apply succeeds; the pickup sensor''s gate value) →

        ``loading`` (set by ``sandbox_load`` when it starts writing for one

        county) → ``succeeded`` | ``failed`` (terminal, set by the asset''s

        try/finally). ``provisioning`` and the mid-load ``loading`` were

        previously the same value; MAIA-2309 split them so the lifecycle reads

        literally instead of overloading ``loading`` across two phases.'
    AvailableCountyResponse:
      properties:
        state:
          type: string
          title: State
        county_name:
          type: string
          title: County Name
        state_fips:
