      title: EnrichRowRequest
      description: "Request schema for enriching rows.\n\nTwo mutually-exclusive selection modes:\n\n- ``feature_ids`` — explicit ids the client has materialized (legacy\n  path; row-detail trigger and small-N enrich-from-cell).\n- ``selection`` — the filter spec the client saw at confirm time;\n  the server recomputes the matching id set and fingerprint/count\n  under a live session. Used by the column-wide enrich confirm gate\n  where the id list would exceed wire-payload limits.\n\nExactly one must be provided; the model-validator enforces this so\na request that drops both or duplicates both is rejected with 422."
