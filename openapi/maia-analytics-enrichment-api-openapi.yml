          type: string
          title: Field Name
          description: The enrichment field name
        launched_total:
          type: integer
          title: Launched Total
          description: Rows this action launched, fixed at kickoff (manifest size)
        resolved_count:
          type: integer
          title: Resolved Count
          description: Launched rows that have reached a terminal state
        started_at:
          type: string
          format: date-time
          title: Started At
          description: When this batch was enqueued
      type: object
      required:
      - coordinator_workflow_id
      - field_name
      - launched_total
      - resolved_count
      - started_at
      title: BatchEnrichmentInfo
      description: 'Run-scoped progress for a single enrichment action [MAIA-2116].


        One per kickoff, keyed on the MAIA-2111 coordinator. ``launched_total`` is

        the fixed denominator (the coordinator manifest''s row count — immune to the

        rolling window AND to waved fan-out); ``resolved_count`` is the numerator

        (manifest children that reached a terminal state).'
