      properties:
        filterType:
          type: string
          enum:
          - text
          - number
          - set
          - date
          - boolean
          title: Filtertype
        operator:
          type: string
          enum:
          - AND
          - OR
          title: Operator
        conditions:
          items:
            oneOf:
            - $ref: '#/components/schemas/CompoundFilter-Input'
            - oneOf:
              - $ref: '#/components/schemas/TextCondition'
              - $ref: '#/components/schemas/NumberCondition'
              - $ref: '#/components/schemas/SetCondition'
              - $ref: '#/components/schemas/DateCondition'
              - $ref: '#/components/schemas/BooleanCondition'
              discriminator:
                propertyName: filterType
                mapping:
                  boolean: '#/components/schemas/BooleanCondition'
                  date: '#/components/schemas/DateCondition'
                  number: '#/components/schemas/NumberCondition'
                  set: '#/components/schemas/SetCondition'
                  text: '#/components/schemas/TextCondition'
          type: array
          title: Conditions
        condition1:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/CompoundFilter-Input'
            - oneOf:
              - $ref: '#/components/schemas/TextCondition'
              - $ref: '#/components/schemas/NumberCondition'
              - $ref: '#/components/schemas/SetCondition'
              - $ref: '#/components/schemas/DateCondition'
              - $ref: '#/components/schemas/BooleanCondition'
              discriminator:
                propertyName: filterType
                mapping:
                  boolean: '#/components/schemas/BooleanCondition'
                  date: '#/components/schemas/DateCondition'
                  number: '#/components/schemas/NumberCondition'
                  set: '#/components/schemas/SetCondition'
                  text: '#/components/schemas/TextCondition'
          - type: 'null'
          title: Condition1
        condition2:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/CompoundFilter-Input'
            - oneOf:
              - $ref: '#/components/schemas/TextCondition'
              - $ref: '#/components/schemas/NumberCondition'
              - $ref: '#/components/schemas/SetCondition'
              - $ref: '#/components/schemas/DateCondition'
              - $ref: '#/components/schemas/BooleanCondition'
              discriminator:
                propertyName: filterType
                mapping:
                  boolean: '#/components/schemas/BooleanCondition'
                  date: '#/components/schemas/DateCondition'
                  number: '#/components/schemas/NumberCondition'
                  set: '#/components/schemas/SetCondition'
                  text: '#/components/schemas/TextCondition'
          - type: 'null'
          title: Condition2
      type: object
      required:
      - filterType
      - operator
      title: CompoundFilter
    InFlightTaskResponse:
      properties:
        workflow_id:
          type: string
          title: Workflow Id
          description: The DBOS workflow ID
        enrichment_id:
          type: string
          format: uuid
          title: Enrichment Id
          description: The enrichment being executed
        feature_id:
          type: string
          title: Feature Id
          description: The feature being enriched
        field_name:
          type: string
          title: Field Name
          description: The enrichment field name
        started_at:
          type: string
          format: date-time
          title: Started At
          description: When the workflow was enqueued
        phase:
          type: string
          enum:
          - queued
          - active
          title: Phase
          description: 'Per-cell lifecycle phase: ''queued'' = ENQUEUED/DELAYED (waiting for a concurrency slot), ''active'' = PENDING (dispatched and executing). Lets a cell distinguish a long queue wait from a run.'
        coordinator_workflow_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Coordinator Workflow Id
          description: The run/batch this task belongs to, so the FE can group resumed tasks per action (MAIA-2116). None for pre-2111 rows.
