          type: string
          enum:
          - individual
          - column
          title: Task Type
          description: Type of enrichment task
          default: column
      type: object
      required:
      - workflow_id
      - enrichment_id
      - feature_id
      - field_name
      - started_at
      - phase
      title: InFlightTaskResponse
      description: Response schema for a single in-flight enrichment workflow.
