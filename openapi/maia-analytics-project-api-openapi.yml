    SandboxProjectResponse:
      properties:
        project_id:
          type: string
          format: uuid
          title: Project Id
      type: object
      required:
      - project_id
      title: SandboxProjectResponse
      description: 'Response carrying the new project''s id so the client can navigate

        straight into it.


        The boundary layer is built asynchronously on a Celery worker — its

        ``layer_id`` is not known at response time. The project page polls the

        project until ``status`` flips from ``pending`` to ``ready`` or

        ``failed`` and then refetches the layer list to discover the boundary.'
    ViewUpdateRequest:
      properties:
        view:
          $ref: '#/components/schemas/ViewUpdateModel'
