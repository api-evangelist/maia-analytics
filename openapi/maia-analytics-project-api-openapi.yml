      description: 'Drawable shape for one candidate: GeoJSON ``geometry`` plus its envelope

        ``bbox`` ``(min_lng, min_lat, max_lng, max_lat)`` so the confirm card can

        draw the boundary and frame the camera in one request.'
    TextContent:
