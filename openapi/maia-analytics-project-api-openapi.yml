        color:
          anyOf:
          - type: string
          - type: 'null'
          title: Color
          description: RGBA color string for this layer's default style (e.g., 'rgba(54, 162, 235, 0.5)')
        layer_id:
          type: string
          format: uuid
          title: Layer Id
          description: Unique identifier for this layer (database UUID)
      type: object
      required:
      - layer_name
      - description
      - table_name
      - layer_id
      title: LayerPlan
      description: A plan for creating a single layer as part of a larger spatial analysis.
    TextCondition:
      properties:
        filterType:
          type: string
          const: text
          title: Filtertype
          default: text
        type:
          type: string
          enum:
