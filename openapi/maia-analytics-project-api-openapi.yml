          anyOf:
          - type: integer
          - type: 'null'
          title: Expected Version
      type: object
      required:
      - view
      title: ViewUpdateRequest
      description: "Request model for updating a single view with partial updates.\n\nAttributes:\n    view: Partial view data with only the fields to update\n    expected_version: The view ``version`` the client's edit is based on.\n        When set, the write is compare-and-set: a stale base raises 409\n        instead of silently overwriting a newer same-view edit."
    SetCondition:
      properties:
        filterType:
