      title: SpatialFilterSpec
      description: 'A single spatial filter that references another layer with a spatial operation.


        Used in layer plans to specify how a layer relates spatially to other layers.

        Replaces the old pattern of separate geographic_bounds_layer_id + reference_layer_name.'
    ToolCallPart:
