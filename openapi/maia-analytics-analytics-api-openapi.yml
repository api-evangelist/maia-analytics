openapi: 3.1.0
info:
  title: MAIA Ah analytics API
  description: API for MAIA application (migrated from Firebase)
  version: 0.1.0
tags:
- name: analytics
paths:
  /api/ext/{path}:
    options:
      tags:
      - analytics
      summary: Proxy Posthog
      description: 'Proxy requests to PostHog API.


        This allows analytics to work even when ad blockers are enabled,

        since requests go through our own domain instead of posthog.com.'
      operationId: proxy_posthog_options
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
          title: Path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - analytics
      summary: Proxy Posthog
      description: 'Proxy requests to PostHog API.


        This allows analytics to work even when ad blockers are enabled,

        since requests go through our own domain instead of posthog.com.'
      operationId: proxy_posthog_post
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
          title: Path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - analytics
      summary: Proxy Posthog
      description: 'Proxy requests to PostHog API.


        This allows analytics to work even when ad blockers are enabled,

        since requests go through our own domain instead of posthog.com.'
      operationId: proxy_posthog_get
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
          title: Path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    FirebaseAuthMiddleware:
      type: http
      scheme: bearer
