          title: Enabled
        is_override:
          type: boolean
          title: Is Override
        global_default:
          type: boolean
          title: Global Default
      type: object
      required:
      - key
      - label
      - description
      - enabled
      - is_override
      - global_default
      title: FeatureToggleItem
      description: 'One governable feature toggle and its effective state for a workspace.


        `enabled` is the resolved on/off (override ?? global ?? seed). `is_override`

        flags whether the workspace has an explicit stored value versus inheriting

        the global default; `global_default` is what it inherits when not overridden.'
    FeatureOverridesResponse:
      properties:
        key:
          type: string
          title: Key
        overrides:
          items:
            $ref: '#/components/schemas/FeatureOverrideWorkspaceItem'
          type: array
          title: Overrides
      type: object
      required:
      - key
      - overrides
      title: FeatureOverridesResponse
      description: Workspaces that override one feature (deviate from the global default).
    AdminProjectSearchResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AdminProjectSearchResult'
          type: array
          title: Items
      type: object
      required:
      - items
      title: AdminProjectSearchResponse
      description: Response schema for project search endpoint.
    AdminLayerSummary:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        feature_count:
          type: integer
          title: Feature Count
      type: object
      required:
      - id
      - name
      - description
      - feature_count
      title: AdminLayerSummary
      description: Layer summary for project preview.
    AdminSkillResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        scope:
          $ref: '#/components/schemas/SkillScope'
        user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: User Id
        workspace_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Workspace Id
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        body:
          type: string
          title: Body
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        is_starter:
          type: boolean
          title: Is Starter
          description: Whether this skill surfaces as a first-run starter in the new-project gallery. System (Ready-made by MAIA) and workspace-scoped skills may be starters; user-scoped skills are never starters.
          default: false
        workspace_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Workspace Ids
          description: The workspaces this curated (system) skill is available in. Empty means global (every workspace).
      type: object
      required:
      - id
      - scope
      - name
      - description
      - body
      - created_at
      - updated_at
      title: AdminSkillResponse
      description: 'A curated skill as returned to the internal admin catalog.


        Adds the ``workspace_ids`` availability set, which the public

        ``SkillResponse`` deliberately omits: for a skill restricted to a set of

        workspaces, that set contains *other* tenants'' workspace ids, so exposing it

        on the public read paths (picker / gallery) would leak cross-tenant data to

        any workspace the skill is visible in. Only the internal admin surface

        (``require_internal``) sees the availability set.'
    GeographyOptionsResponse:
      properties:
        states:
          items:
            $ref: '#/components/schemas/StateOption'
          type: array
          title: States
        counties:
          items:
            $ref: '#/components/schemas/CountyOption'
          type: array
          title: Counties
      type: object
      required:
      - states
      - counties
      title: GeographyOptionsResponse
      description: Available geography options for workspace restriction.
